# AutoDock Vina config — AGA-RX PATH C · ARM 1 · LDHB COUNTER-SCREEN (selectivity)
# Target : human LDHB (L-lactate dehydrogenase B / H chain), PDB 1I0Z chain A
# Role   : OFF-TARGET counter-screen. We WANT weak binding here. A selective
#          LDHA hit = strongly negative dG_LDHA but only weakly negative (or
#          positive) dG_LDHB. Selectivity score = dG_LDHA - dG_LDHB.
# Pocket : the homologous substrate(oxamate, OXM) + NADH(NAI) catalytic site.
#          Catalytic His193 / Arg169 / Asp (LDHB numbering; +1 vs LDHA) — the
#          same chemistry, but the active-site loop & a few funnel residues
#          differ (Gln100/Asn113 etc.), which is the selectivity handle.
# Pocket residues (<=5A of OXM, and <=4.5A of NAI, chain A): VAL26 GLY27 VAL28
#   GLY29 GLN30 VAL31 GLY32 ASP52 VAL53 LEU54 TYR83 THR95 ALA96 GLY97 VAL98
#   ARG99 GLN100 ARG106 LEU109 ASN113 VAL116 ILE120 VAL136 SER137 ASN138 VAL140
#   SER161 LEU165 ARG169 HIS193 ALA238 ILE242 TYR247 THR248 ILE252
#
# NOTE: 1I0Z and 6Q0D are in DIFFERENT coordinate frames; this center is the
# OXM+NAI centroid in the 1I0Z chain A frame. Box dimensions are matched to the
# LDHA box so the dG comparison is geometrically fair (same search volume).

receptor = ldhb_chainA_receptor.pdbqt

# centroid of OXM + NAI in 1I0Z chain A coordinate frame
center_x = 14.2
center_y = 39.6
center_z = 57.2
size_x = 26
size_y = 24
size_z = 22

exhaustiveness = 16
num_modes = 9
energy_range = 4
