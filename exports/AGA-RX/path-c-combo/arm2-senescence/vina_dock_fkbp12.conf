# AutoDock Vina config — AGA-RX PATH C · ARM 2 (OPTIONAL) · FKBP12 / mTOR-FRB
# Target : FKBP12 (FK506-binding protein), PDB 1FAP chain A
#          (1FAP = FKBP12 [chain A] + rapamycin [RAP] + mTOR/FRAP-FRB [chain B])
# Thesis : AUTOPHAGY-RESTORE arm. Rapalogs do NOT inhibit mTOR by occupying a
#          single pocket — they bind FKBP12 first, and the FKBP12-rapalog binary
#          complex then presents a COMPOSITE surface that docks onto the mTOR FRB
#          domain, allosterically blocking mTORC1. Restoring autophagy in
#          DHT-senescent dermal papilla clears damaged organelles / dampens SASP.
# Pocket : FKBP12 hydrophobic drug pocket that the rapamycin binding-domain
#          (pipecolyl + triene) face inserts into.
# FKBP12 pocket residues (<=5A of RAP, chain A): TYR26 PHE36 ASP37 ARG42 PHE46
#   GLN53 GLU54 VAL55 ILE56 TRP59 TYR82 HIS87 ILE90 ILE91 PHE99
#   (Trp59 / Phe46 / Phe99 = the deep aromatic FKBP pocket; Asp37/Tyr82 = H-bonds)
# mTOR-FRB contact face (chain B, <=5.5A of RAP): LEU2031 GLU2032 SER2035 ARG2036
#   PHE2039 GLY2040 LYS2095 THR2098 GLN2099 TRP2101 ASP2102 TYR2104 TYR2105 PHE2108
#
# MECHANISM CAVEAT: classic single-receptor Vina docking models ONLY the FKBP12
# binding step (where rapalog SAR lives). The FRB ternary interface is NOT a Vina
# docking problem (protein-protein composite) — use the FKBP12+FRB COMPOSITE
# receptor + protein-protein tools for that. This .conf = the FKBP12-binding step.

receptor = fkbp12_chainA_receptor.pdbqt

# centroid of RAP (rapamycin) in 1FAP chain A coordinate frame
center_x = -8.6
center_y = 26.9
center_z = 36.9
# rapamycin is a large macrolide -> generous box
size_x = 30
size_y = 24
size_z = 32

exhaustiveness = 16
num_modes = 9
energy_range = 4
seed = 42
